services:
  acp-api:
    image: $IMAGE_NAME:$IMAGE_TAG
    container_name: $APP_NAME
    restart: always
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_KEY=${JWT_KEY}
      - JWT_ISSUER=${JWT_ISSUER}
      - JWT_EXPIRES_ACCESS_TOKEN_MINUTE=${JWT_EXPIRES_ACCESS_TOKEN_MINUTE}
      - FILE_UPLOAD_PATH=${FILE_UPLOAD_PATH}
      - MEDIA_BASE_URL=${MEDIA_BASE_URL}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
    networks:
      - proxynet
    volumes:
      - SharedAssets:/root/uploads

networks:
  proxynet:
    external: true
    name: proxynet

volumes:
  SharedAssets:
    external: true